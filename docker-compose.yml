services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: umang-swiggy-mcp
      POSTGRES_PASSWORD: umang1221
      POSTGRES_DB: swiggy_mcp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  pgdata: